<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline – Lantern</title>
  <style>
    :root {
      --color-primary: #182350;
      --color-primary-hover: #26346e;
      --color-accent: #b9915e;
      --color-surface-muted: #f8f9fb;
      --color-surface: #ffffff;
      --color-text-primary: #1f2430;
      --color-text-secondary: #6b7280;
      --color-border: #e5e7eb;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--color-surface-muted);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--color-text-secondary);
      margin-bottom: 1.75rem;
    }
    button {
      background-color: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    button:hover {
      background-color: var(--color-primary-hover);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">No connection</div>
    <h1>You're offline</h1>
    <p>Lantern needs an internet connection to load your school's data. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
